version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mto-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_mto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mto-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mto-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mto-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=gestion_mto
    depends_on:
      - postgres
    networks:
      - mto-network

volumes:
  postgres_data:

networks:
  mto-network:
    driver: bridge