version: '3.8'

services:
  backend:
    build: ./backend
    container_name: gestion_meteo_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=development

  frontend:
    build: ./frontend
    container_name: gestion_meteo_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app