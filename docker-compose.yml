version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mto-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - mto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mto-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mto-network

networks:
  mto-network:
    driver: bridge